name: Windows client smoke test

# Manual check of a packaged Windows client: does it start, stay up,
# and what do its logs and the Windows event log say.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Windows x64 portable client zip
        required: true
        default: https://rdesk.cool.bytecraft.ro/suport/ELNDesk-Support-1.5.0-windows-x64.zip
      seconds:
        description: How long to let the client run
        required: true
        default: "60"
      remove:
        description: Comma-separated files to delete from the client folder before running
        required: false
        default: ""
      relaunch:
        description: Start the client a second time and take another screenshot (Y/N)
        required: false
        default: "N"
      install:
        description: After the portable run, run --silent-install and check the installed copy (Y/N)
        required: false
        default: "N"
      setpassword:
        description: Install through the zip's Instaleaza-permanent.cmd with a random permanent password (Y/N)
        required: false
        default: "N"
      preinstall_url:
        description: Optional older client zip to install first, so the install step becomes an upgrade
        required: false
        default: ""

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download and extract
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ inputs.url }}" -OutFile client.zip
          Get-FileHash client.zip -Algorithm SHA256 | Format-List
          Expand-Archive client.zip -DestinationPath client
          Get-ChildItem client -Recurse -Depth 1 | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Run client
        shell: pwsh
        run: |
          # The launcher is betterdesk.exe, or renamed after the package (ELNDesk.exe, ELNDesk-Support.exe).
          $exe = Get-ChildItem client -Recurse -Include betterdesk.exe, 'ELNDesk*.exe' | Select-Object -First 1
          "launcher: $($exe.Name)"
          foreach ($name in ("${{ inputs.remove }}" -split ',' | Where-Object { $_.Trim() })) {
            Remove-Item (Join-Path $exe.DirectoryName $name.Trim()) -Force
            "removed $name"
          }
          $start = Get-Date
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          $deadline = $start.AddSeconds([int]"${{ inputs.seconds }}")
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if ($p.HasExited) {
            "RESULT: exited after {0:N1}s with code {1} (0x{1:X8})" -f ((Get-Date) - $start).TotalSeconds, $p.ExitCode
          } else {
            "RESULT: still running after ${{ inputs.seconds }}s"
          }
          Get-Process | Where-Object { $_.ProcessName -match 'betterdesk|rustdesk|ELNDesk' } |
            Format-Table Id, ProcessName, MainWindowTitle, StartTime -AutoSize
          function Save-Screen($name) {
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              New-Item -ItemType Directory -Force out | Out-Null
              $bmp.Save("$PWD\out\$name")
            } catch { "screenshot failed: $_" }
          }
          Save-Screen 'screen.png'
          Get-Process | Where-Object { $_.ProcessName -match 'betterdesk|rustdesk|ELNDesk' } | Stop-Process -Force -ErrorAction SilentlyContinue
          if ("${{ inputs.relaunch }}" -eq 'Y') {
            Start-Sleep -Seconds 3
            Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName | Out-Null
            Start-Sleep -Seconds 30
            Save-Screen 'screen-relaunch.png'
            Get-Process | Where-Object { $_.ProcessName -match 'betterdesk|rustdesk|ELNDesk' } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if ("${{ inputs.install }}" -eq 'Y') {
            Start-Sleep -Seconds 3
            if ("${{ inputs.preinstall_url }}") {
              Invoke-WebRequest -Uri "${{ inputs.preinstall_url }}" -OutFile pre.zip
              Expand-Archive pre.zip -DestinationPath pre
              $preExe = Get-ChildItem pre -Recurse -Include betterdesk.exe, 'ELNDesk*.exe' | Select-Object -First 1
              $pre = Start-Process -FilePath $preExe.FullName -ArgumentList '--silent-install' -WorkingDirectory $preExe.DirectoryName -PassThru
              $pre | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 30
              "preinstalled $($preExe.Name), exit code $($pre.ExitCode); running before the upgrade:"
              Get-Process | Where-Object { $_.ProcessName -match 'betterdesk|rustdesk|ELNDesk' } |
                Format-Table Id, ProcessName, Path -AutoSize
            }
            $installCmd = Get-ChildItem client -Recurse -Filter Instaleaza-permanent.cmd | Select-Object -First 1
            if ("${{ inputs.setpassword }}" -eq 'Y' -and $installCmd) {
              # Same path a technician takes; the password comes from the env var instead of the prompt.
              $env:ELNDESK_PAROLA = [guid]::NewGuid().ToString('N').Substring(0, 12)
              cmd.exe /c "$($installCmd.FullName) < NUL"
              "install script exit code: $LASTEXITCODE"
              Remove-Item Env:ELNDESK_PAROLA
            } else {
              $inst = Start-Process -FilePath $exe.FullName -ArgumentList '--silent-install' -WorkingDirectory $exe.DirectoryName -PassThru
              $inst | Wait-Process -Timeout 120 -ErrorAction SilentlyContinue
              "install exit code: $($inst.ExitCode)"
            }
            Start-Sleep -Seconds 40
            Get-ChildItem "$env:ProgramFiles" -Directory | Where-Object { $_.Name -match 'ELND|BetterDesk|RustDesk' } | ForEach-Object {
              "installed dir: $($_.FullName)"
              Get-ChildItem $_.FullName -File | Select-Object Name, Length | Format-Table -AutoSize
              # After an upgrade the installed files must be the new package's, not left locked.
              foreach ($pair in @(@('betterdesk.exe', $exe.FullName), @('librustdesk.dll', (Join-Path $exe.DirectoryName 'librustdesk.dll')))) {
                $inst = Join-Path $_.FullName $pair[0]
                $same = (Test-Path $inst) -and ((Get-FileHash $inst).Hash -eq (Get-FileHash $pair[1]).Hash)
                "installed $($pair[0]) matches the package: $same"
              }
            }
            Get-Service | Where-Object { $_.Name -match 'ELND|BetterDesk|RustDesk' -or $_.DisplayName -match 'ELND|BetterDesk|RustDesk' } |
              Format-Table Name, DisplayName, Status -AutoSize
            Get-Process | Where-Object { $_.ProcessName -match 'betterdesk|rustdesk|ELNDesk' } |
              Format-Table Id, ProcessName, Path, MainWindowTitle -AutoSize
            foreach ($root in 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming', 'C:\Windows\System32\config\systemprofile\AppData\Roaming') {
              Get-ChildItem $root -Recurse -Filter '*.toml' -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'ELND' -and $_.Name -notmatch '(_local|2)\.toml$' } | ForEach-Object {
                  $m = Select-String -Path $_.FullName -Pattern "^password = '(.+)'" | Select-Object -First 1
                  "service config $($_.FullName): permanent password set = $([bool]$m)"
                }
            }
            Save-Screen 'screen-installed.png'
          }

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($root in @($env:APPDATA, $env:ProgramData, $env:LOCALAPPDATA)) {
            Get-ChildItem $root -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'ELNDesk|betterdesk' } |
              ForEach-Object {
                "===== $($_.FullName)"
                Get-Content $_.FullName -Tail 120
                Copy-Item $_.FullName -Destination ("out\" + ($_.FullName -replace '[:\\ ]', '_'))
              }
          }
          "===== Application event log (errors, last 15 min)"
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Id, Message

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-smoke
          path: out
